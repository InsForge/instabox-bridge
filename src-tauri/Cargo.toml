[package]
name = "instabox-bridge"
version = "0.1.13"
description = "Connect instabox cloud sandboxes to the T3 Code desktop app"
license = "MIT"
edition = "2024"

[lib]
name = "instabox_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
dirs = "6"
which = "7"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
toml_edit = "0.22"
semver = "1"
# Reads cmux's version from its app bundle. Tauri already depends on it.
plist = "1"
# Paradev's host id is an HMAC-SHA256. rustls already depends on it.
ring = "0.17"
# The T3 local proxy (prototype, behind INSTAADE_T3_PROXY): its localhost server and its
# WebSockets to the sandbox.
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1"
# DPoP proofs (base64url JWTs) for the proxy's session upstream.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

# Start at login through SMAppService on macOS 13 and later, and the old app: asking it to
# quit (NSRunningApplication) and moving it to the Trash (NSFileManager, libc). Tauri and the
# autostart plugin already depend on these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSError", "NSFileManager", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService", "SMErrors"] }
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# A mock app, so the updater plugin runs in tests. Not on Windows, where such a test binary
# does not start.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
